[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-osint-hub"
version = "2.1.0"
description = "Autonomous, evidence-cited OSINT investigation: ERKG memory, epistemic provenance, hypothesis-driven pivot engine, MCP + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hamidaliyev091" }]
keywords = ["osint", "threat-intelligence", "knowledge-graph", "mcp", "autonomous-agents"]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.28",
    "mcp>=1.0,<2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0"]
vision = ["Pillow>=10.0"]
local-ai = ["fastembed>=0.4.0"]

[project.scripts]
ai-osint-hub = "hub.cli:main"

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.setuptools.package-data]
"hub" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits the public internet (enabled with AI_OSINT_HUB_LIVE=1)",
]
